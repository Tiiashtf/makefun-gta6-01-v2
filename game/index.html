<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar Bay — an open-world crime game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e2a3a;
    font-family: Arial, Helvetica, sans-serif; color: #fff; }
  #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .hud-stats { position: absolute; top: 14px; left: 16px; display: flex; flex-direction: column; gap: 6px; }
  .hud-money { font-size: 30px; font-weight: bold; color: #7dff8a; text-shadow: 2px 2px 0 rgba(0,0,0,.7); }
  .hud-health { width: 180px; height: 18px; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.7); border-radius: 9px; overflow: hidden; position: relative; }
  .hud-health-bar { height: 100%; width: 100%; background: #37d67a; }
  .hud-health-text { position: absolute; inset: 0; text-align: center; font-size: 12px; font-weight: bold; line-height: 15px; text-shadow: 1px 1px 0 #000; }
  .hud-weapon { font-size: 15px; font-weight: bold; text-shadow: 2px 2px 0 rgba(0,0,0,.7); }
  .hud-right { position: absolute; top: 14px; right: 16px; text-align: right; }
  .hud-stars { font-size: 30px; letter-spacing: 2px; text-shadow: 2px 2px 0 rgba(0,0,0,.8); }
  .hud-clock { font-size: 22px; font-weight: bold; text-shadow: 2px 2px 0 rgba(0,0,0,.7); }
  .hud-objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: 560px;
    background: rgba(10, 20, 30, .72); border: 1px solid rgba(255, 210, 60, .8); border-radius: 8px;
    padding: 8px 14px; font-size: 15px; font-weight: bold; text-align: center; text-shadow: 1px 1px 0 #000; }
  .hud-objective-dist { color: #ffd23c; margin-left: 8px; }
  .hud-map { position: absolute; left: 16px; bottom: 16px; border: 2px solid rgba(255,255,255,.75);
    border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 3px rgba(0,0,0,.4); background: #0e2a3a; }
  .hud-map-title { position: absolute; top: 2px; left: 6px; font-size: 11px; font-weight: bold; letter-spacing: 1px;
    color: #fff; text-shadow: 1px 1px 0 #000; z-index: 2; }
  .hud-minimap { display: block; width: 220px; height: 220px; }
  .hud-speed { position: absolute; right: 18px; bottom: 18px; font-size: 34px; font-weight: bold;
    text-shadow: 2px 2px 0 rgba(0,0,0,.8); }
  .hud-crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 26px; font-weight: bold; color: rgba(255,255,255,.9); text-shadow: 0 0 4px #000; }
  .hud-hitmarker { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 34px; font-weight: bold; color: #ff4444; text-shadow: 0 0 6px #000; }
  .hud-prompt { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%);
    background: rgba(10, 20, 30, .8); border: 1px solid #fff; border-radius: 6px; padding: 7px 14px;
    font-size: 16px; font-weight: bold; }
  .hud-toast { position: absolute; left: 50%; top: 84px; transform: translateX(-50%);
    background: rgba(10, 20, 30, .8); border-radius: 6px; padding: 8px 16px; font-size: 16px; font-weight: bold;
    transition: opacity .4s; white-space: nowrap; }
  .hud-damage { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(255,0,0,.55) 100%);
    opacity: 0; transition: opacity .15s; }

  #overlays { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; background: rgba(8, 16, 26, .82); pointer-events: auto; padding: 24px; }
  .overlay h1 { font-size: 64px; letter-spacing: 6px; color: #ffd23c; text-shadow: 3px 3px 0 rgba(0,0,0,.8); margin-bottom: 10px; }
  .overlay p { max-width: 640px; font-size: 17px; line-height: 1.5; margin: 8px 0; }
  .game-title { font-size: 84px !important; }
  .game-sub { font-size: 20px !important; color: #9fd8ff; }
  .game-story { color: #e8e8e8; }
  .game-controls { margin-top: 14px; font-size: 15px; line-height: 1.9; color: #cfe3f2;
    background: rgba(255,255,255,.06); border-radius: 8px; padding: 10px 22px; }
  .game-controls b { color: #ffd23c; }
  .game-credit { font-size: 13px !important; color: #9aa8b5; margin-top: 16px !important; }
  .btn-row { display: flex; gap: 14px; margin-top: 18px; }
  .btn { pointer-events: auto; font-size: 18px; font-weight: bold; padding: 13px 26px; border-radius: 8px;
    border: 2px solid #fff; background: rgba(255,255,255,.12); color: #fff; cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.28); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn-primary { background: #d7263d; border-color: #ff8a96; }
  .btn-primary:hover { background: #f0405a; }
  .overlay-wasted h1 { color: #e74c3c; }
  .overlay-busted h1 { color: #3498db; }
  .overlay-complete h1 { color: #ffd23c; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="hud"></div>
<div id="overlays"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
